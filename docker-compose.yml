services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile

    container_name: marketplace_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env
    dns:
      - 8.8.8.8
      - 1.1.1.1

  frontend:
    build:
      context: ./frontend

    container_name: marketplace_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - VITE_API_URL=http://localhost:8000

    depends_on:
      - backend